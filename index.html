<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuella Boutique</title>
<link rel="icon" href="/logo.png">
<style>
:root{--pk:#e6007e;--bd:#e6e6e6;--mut:#888}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:rgba(0,0,0,.82);background:#fff;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.bar{background:var(--pk);color:#fff;text-align:center;font-size:12.5px;font-weight:700;padding:8px 12px}
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
header img{height:40px;width:auto;display:block;cursor:pointer}
.chips{gap:6px}
.chip{border:1.5px solid #ddd;background:#fff;border-radius:16px;padding:5px 11px;font-size:12px;font-weight:600;color:#555}
.chip.on{background:#000;color:#fff;border-color:#000}
.wrap{max-width:1100px;margin:0 auto;padding:14px 12px 40px}
.cats{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.cats .chip{white-space:nowrap;padding:5px 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{border:1px solid #e6e6e6;border-radius:10px;overflow:hidden;cursor:pointer;background:#fff}
.card div{padding:10px 10px 14px}
.card .n{font-size:13px;font-weight:600;color:#000;line-height:1.35;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:0}
.card .pp{font-size:15px;font-weight:700;color:#000;padding:0}
.sk{aspect-ratio:3/4;border-radius:10px;background:linear-gradient(90deg,#f0f0f0 25%,#f8f8f8 50%,#f0f0f0 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--mut)}
.pv{max-width:480px;margin:0 auto;padding:0 4px 90px}
.back{background:none;border:0;font-size:14px;font-weight:700;padding:12px 4px;color:#000}
.th{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.th img{width:56px;height:56px;border-radius:8px;object-fit:cover;border:2px solid transparent;opacity:.7;flex:0 0 auto}
.th img.on{border-color:#000;opacity:1}
.stars{color:#f5a623;font-size:13px;font-weight:700;margin:14px 0 6px}
.stars span{color:rgba(0,0,0,.7);font-weight:600}
h1{font-size:19px;line-height:1.4;margin:0 0 10px;color:#000}
.price{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.price b{font-size:24px;color:#000}
.price s{color:#999;font-size:15px}
.lb{font-size:12px;font-weight:700;color:#666;text-transform:uppercase;margin:12px 0 6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid #ddd;background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600}
.opt.on{border-color:#000;background:#fafafa}
.msg{color:#d0021b;font-size:13px;margin-top:8px}
.btn{width:100%;padding:13px;background:#000;color:#fff;font-size:15px;font-weight:700;border:0;border-radius:8px;text-transform:uppercase;letter-spacing:.4px;margin-top:14px}
.btn:disabled{background:#999;cursor:not-allowed}
.trust{overflow:hidden;white-space:nowrap;margin:16px 0;padding:10px 0;border-top:1px solid #e6e6e6;border-bottom:1px solid #e6e6e6;font-size:12.5px;font-weight:600}
.trk{display:inline-flex;animation:mq 16s linear infinite}
.trk span{padding:0 22px}
.desc{font-size:14px;line-height:1.6;margin:10px 0 26px}
.desc img{max-width:100%;border-radius:10px;display:block;margin:14px auto}
.desc p{margin:0 0 12px}
.sec{max-width:480px;margin:0 auto;padding:6px 4px 26px}
.st{font-size:16px;font-weight:800;color:#000;text-align:center;margin-bottom:14px}
.tk{overflow:hidden;white-space:nowrap}
.tt{display:inline-flex;animation:mq 28s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.tc{display:inline-flex;gap:8px;width:210px;white-space:normal;background:#fafafa;border:1px solid #e6e6e6;border-radius:10px;padding:10px;margin-right:8px;vertical-align:top}
.tc img,.tc i{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#e0e0e0;flex:0 0 auto}
.tc b{font-size:12.5px;color:#000;display:block}
.tc span{font-size:12px;line-height:1.4}
.fq{border:1px solid #e6e6e6;border-radius:10px;margin-bottom:8px;overflow:hidden}
.fq button{width:100%;text-align:left;background:#fff;border:0;padding:14px 16px;font-size:14px;font-weight:700;color:#000}
.fq p{display:none;margin:0;padding:0 16px 14px;font-size:13.5px;line-height:1.6}
.fq.on p{display:block}
.sticky{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e6e6e6;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;z-index:60}
.sticky b{font-size:15px;color:#000;white-space:nowrap}
.sticky .btn{margin:0;padding:11px;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99;display:none;align-items:flex-end;justify-content:center}
@media(min-width:768px){.ov{align-items:center}}
.md{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:22px 20px 30px;position:relative}

.x{position:absolute;top:12px;right:14px;background:#f0f0f0;border:0;border-radius:50%;width:32px;height:32px;font-size:15px}
.md h2{font-size:17px;text-align:center;margin:0 30px 14px 0;color:#111}
.free{background:#1a8a1a;color:#fff;text-align:center;font-weight:700;padding:10px;border-radius:8px;margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label{font-size:14px;font-weight:600;color:#333}
.f input,.f textarea,.f select{width:100%;padding:12px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;background:#fafafa;font-family:inherit}
.f input:focus,.f textarea:focus,.f select:focus{outline:0;border-color:#000;background:#fff}
.sum{background:#f7f7f7;border:1px solid #eee;border-radius:8px;padding:14px;margin-bottom:12px;font-size:14px}
.sum strong{font-size:17px;color:#000}
.warn{background:#fff8e1;border:1px solid #ffc107;border-radius:8px;padding:12px 14px;font-size:13px;color:#7a5000;line-height:1.5;margin-bottom:12px}
.sub{background:#1a8a1a;margin-top:6px}
.sub:disabled{background:#aaa}
#stt{display:none;padding:12px 14px;border-radius:8px;font-size:14px;font-weight:600;text-align:center;margin-bottom:10px}
#stt.e{background:#ffebee;color:#b71c1c;display:block}
#stt.o{background:#e8f5e9;color:#1b5e20;display:block}
#stt.l{background:#e3f2fd;color:#0d47a1;display:block}
footer{background:#000;color:#bdbdbd;padding:30px 18px calc(30px + env(safe-area-inset-bottom));font-size:13px;line-height:1.7}
footer b{color:#fff;display:block;font-size:15px;margin-bottom:6px}
.fsel{margin-top:14px;font-size:12.5px;color:#888}
.fl{background:none;border:0;color:#bdbdbd;text-decoration:underline;padding:2px 4px;font-size:12.5px}
.fl.on{color:#fff;font-weight:700;text-decoration:none}
footer img{height:46px;width:auto;background:#fff;border-radius:8px;padding:6px 10px;margin-bottom:12px}
@keyframes vib{0%{transform:translateX(0)}10%{transform:translateX(-3px) rotate(-1deg)}20%{transform:translateX(3px) rotate(1deg)}30%{transform:translateX(-3px)}40%{transform:translateX(3px)}50%{transform:translateX(-2px)}60%{transform:translateX(2px)}70%{transform:translateX(-1px)}80%{transform:translateX(1px)}100%{transform:translateX(0)}}
.vib{animation:vib .8s ease-in-out infinite;animation-delay:2s}
.vib:active{animation:none;transform:scale(.98)}
#brands-sec{max-width:none;margin-top:10px}
.bt{overflow:hidden;white-space:nowrap;padding:6px 0}
.bt-t{display:inline-flex;align-items:center;animation:mq 30s linear infinite}
.bt-t img{height:40px;width:auto;max-width:110px;object-fit:contain;margin:0 20px}
.hs{flex:1;display:flex;align-items:center;gap:2px}
.hs.r{justify-content:flex-end}
.ib{background:none;border:0;padding:6px;color:#000;display:flex;position:relative}
.ib svg{width:22px;height:22px}
.cb{position:absolute;top:-2px;right:-3px;background:#000;color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.pf{position:relative;overflow:hidden;background:#fafafa;aspect-ratio:3/4}
.pf img{position:absolute;inset:0;width:100%;height:100%;display:block}
.pf .bg{object-fit:cover;filter:blur(16px);transform:scale(1.2);opacity:.6}
.pf .fg{object-fit:contain}
.pf-main{aspect-ratio:4/5;border-radius:12px}
.card .pf{padding:0}
.btn.out{background:#fff;color:#000;border:1.5px solid #000;margin-top:10px}
.btn.out:disabled{background:#fff;color:#999;border-color:#ccc}
.dov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9998}.dov.on{display:block}
.drw{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:320px;background:#fff;z-index:9999;transform:translateX(-100%);transition:transform .25s;overflow-y:auto;padding:14px 0}
.drw.on{transform:none}
.dl{display:block;width:100%;text-align:left;padding:14px 20px;font-size:15px;font-weight:600;color:#000;background:none;border:0;border-bottom:1px solid #e6e6e6}
.dset{padding:16px 20px;font-size:13px;color:#555;line-height:2.4}
.drw .fl{color:#777}.drw .fl.on{color:#000}
.sr{display:none;position:fixed;top:0;left:0;right:0;background:#fff;z-index:9999;padding:12px;border-bottom:1px solid #e6e6e6;gap:10px;align-items:center}
.sr.on{display:flex}
.sr input{flex:1;padding:10px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;font-family:inherit}
.sr button{border:0;background:none;font-weight:600;font-size:14px}
.ci{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.ci img{width:56px;height:70px;object-fit:cover;border-radius:6px;background:#fafafa}
.cin{flex:1;min-width:0;font-size:13px}.cin b{display:block;color:#000}.cin small{color:#888}
.cq{display:flex;align-items:center;gap:10px;margin-top:6px}
.cq button{width:26px;height:26px;border:1.5px solid #ddd;background:#fff;border-radius:6px;font-size:15px}
.cr{text-align:right;font-size:13px;color:#000}.cr button{display:block;margin:6px 0 0 auto;border:0;background:none;color:#999;font-size:16px}
.ctot{display:flex;justify-content:space-between;padding:14px 0 0;font-size:15px;color:#000}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);background:#000;color:#fff;font-size:13px;font-weight:600;padding:10px 18px;border-radius:20px;z-index:99999;opacity:0;transition:.3s;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
#splash{position:fixed;inset:0;background:#fff;z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
#splash.off{opacity:0;pointer-events:none}
#splash img{width:180px;max-width:60%;height:auto;animation:pl 1.4s ease-in-out infinite}
#splash .bar{width:120px;height:3px;background:#f0f0f0;border-radius:3px;margin-top:22px;overflow:hidden}
#splash .bar i{display:block;width:40%;height:100%;background:var(--pk);border-radius:3px;animation:ld 1.1s ease-in-out infinite}
@keyframes pl{50%{opacity:.55}}
@keyframes ld{0%{margin-left:-40%}100%{margin-left:100%}}
.bar{background:#000;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px}
.cats{display:flex;gap:24px;overflow-x:auto;margin:0;padding:13px 16px 0;border-bottom:1px solid #eee;scrollbar-width:none}
.cats::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}
.cn{background:none;border:0;padding:0 0 11px;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#888;white-space:nowrap;border-bottom:1.5px solid transparent}
.cn.on{color:#000;border-bottom-color:#000}
.hp{padding:26px 16px 6px;max-width:1100px;margin:0 auto}
.sh2{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.sh2 span{font-size:15px;font-weight:500;letter-spacing:.02em;color:#000}
.sh2 a{font-size:12px;text-decoration:underline;color:#000;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{position:relative;aspect-ratio:3/4;overflow:hidden;cursor:pointer;background:#f3f1ee}
.tile:last-child:nth-child(odd){grid-column:1/-1;aspect-ratio:16/10}
.tile img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.5),rgba(0,0,0,0) 50%)}
.tile span{position:absolute;left:0;right:0;bottom:16px;z-index:2;text-align:center;color:#fff;font-size:13px;font-weight:500;letter-spacing:.18em;text-transform:uppercase}
.rail{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.rc{flex:0 0 44%;max-width:190px;cursor:pointer}
.card,.rc{border:0;border-radius:0;background:#fff}
.ci2{padding:8px 0 14px}
.ci2 span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#000;margin-bottom:2px}
.ci2 .n{font-size:12.5px;font-weight:400;color:#111;line-height:1.35;margin:0 0 4px;padding:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ci2 .pp{font-size:12.5px;font-weight:500;color:#111;padding:0}
.hp .grid{gap:18px 10px}
.bar{display:none}
:root{--pk:#f0147a}
.sbar-w{padding:10px 16px 6px}
.sbar{display:flex;align-items:center;gap:10px;background:#f3f3f3;border-radius:24px;padding:0 16px}
.sbar svg{width:18px;height:18px;color:#777;flex:0 0 auto}
.sbar input{flex:1;border:0;background:none;padding:12px 0;font-size:14px;outline:0;font-family:inherit;margin:0}
.slider{position:relative;overflow:hidden}
.sl-t{display:flex;transition:transform .45s ease}
.sl-t img{flex:0 0 100%;width:100%;display:block;cursor:pointer}
.sl-a{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:20px;line-height:1}
.sl-a.l{left:10px}.sl-a.r{right:10px}
.sl-d{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px}
.sl-d i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.75)}
.sl-d i.on{background:var(--pk)}
.promo-w{border-radius:12px}
.circ{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.circ::-webkit-scrollbar{display:none}
.cc{flex:0 0 auto;width:84px;text-align:center;cursor:pointer}
.cc img{width:84px;height:84px;border-radius:50%;object-fit:cover;display:block;background:#fde7f0}
.cc b{display:block;font-size:11.5px;font-weight:500;color:#111;margin-top:8px;line-height:1.25}
.cc i{display:block;color:var(--pk);font-style:normal;font-size:14px;margin-top:4px}
.sh2 span{font-weight:700;font-size:16px}
.sh2 a{color:var(--pk);text-decoration:none;font-size:12.5px;font-weight:500}
.rc{flex:0 0 140px;max-width:none}
.nb{position:absolute;top:6px;left:6px;z-index:3;background:var(--pk);color:#fff;font-size:9.5px;font-weight:600;padding:3px 7px;border-radius:4px}
.ht{position:absolute;top:6px;right:6px;z-index:3;width:26px;height:26px;border-radius:50%;background:#fff;border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.15);padding:0}
.ht svg{width:14px;height:14px;fill:none;stroke:#111;stroke-width:2}
.ht.on svg{fill:var(--pk);stroke:var(--pk)}
.ci2 .pp{color:var(--pk);font-weight:700}
.stz{color:#f5a623;font-size:11px;letter-spacing:1px;margin-top:2px}
.trustimg{width:100%;display:block;border-radius:12px}
#brands-sec{margin-top:6px;padding-top:14px}
#brands-sec .st{text-align:left;padding:0 16px;font-size:15px;font-weight:600}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:55;background:#fff;border-top:1px solid #eee;display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#666;position:relative;padding:2px 0}

.bd{position:absolute;top:-3px;left:calc(50% + 6px);background:var(--pk);color:#fff;font-style:normal;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 3px}
.cb{background:var(--pk)}
.cd{background:#000;border-radius:8px;padding:12px;text-align:center;margin-top:14px}

.cd-n{display:flex;justify-content:center;gap:14px}

.cd-n i{color:#fff;font-size:9px;font-style:normal;text-transform:uppercase;letter-spacing:.5px}
.vi{text-align:center;font-size:12.5px;color:#666;margin-top:12px}
.vi i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#1a8a1a;margin-right:6px;animation:bl 1.5s infinite}

</head>

  var ph = p.photos && p.photos.length ? p.photos : [p.photo];
  $("g-main").src = $("g-bg").src = ph[0];
  $("g-th").innerHTML = ph.length > 1 ? ph.map(function(u,i){ return '<img class="' + (i===0?"on":"") + '" src="' + E(u) + '" onclick="showPh(this)">' }).join("") : "";
  $("p-name").textContent = nm(p);
  $("p-price").innerHTML = v ? '<b>' + fmt(pr(v)) + '</b>' + (op(v) > pr(v) ? '<s>' + fmt(op(v)) + '</s>' : '') : '<b>—</b>';
  $("s-price").textContent = v ? fmt(pr(v)) : "—";
  SZ = uniq(V.map(function(x){return x.size})); CL = uniq(V.map(function(x){return x.color}));
  var o = "";
  if (SZ.length) o += '<div class="lb">' + t("size") + '</div><div class="opts">' + SZ.map(function(s,i){ return '<button class="opt' + (SEL.size===s?" on":"") + '" onclick="pick(\'size\',' + i + ')">' + E(s) + '</button>' }).join("") + '</div>';
  if (CL.length) o += '<div class="lb">' + t("color") + '</div><div class="opts">' + CL.map(function(s,i){ return '<button class="opt' + (SEL.color===s?" on":"") + '" onclick="pick(\'color\',' + i + ')">' + E(s) + '</button>' }).join("") + '</div>';
  $("p-opts").innerHTML = o;
  $("p-msg").textContent = (!v && V.length) ? t("none") : "";
  $("p-desc").innerHTML = ds(p);
  $("p-btn").disabled = $("s-btn").disabled = !v || !!SET.suspended;
  $("p-btn").className = "btn" + ((v && !SET.suspended) ? " vib" : ""); $("a-btn").disabled = !v || !!SET.suspended;
}
function showPh(el){
  $("g-main").src = $("g-bg").src = el.src;
  document.querySelectorAll("#g-th img").forEach(function(i){ i.className = "" });
  el.className = "on";
}
function pick(k, i){
  var val = (k === "size" ? SZ : CL)[i]; SEL[k] = val;
  if (!getV()) { var f = vs(CP).filter(function(v){return v[k] === val})[0]; if (f) SEL = {size:f.size,color:f.color}; }
  renderProd();
}

// ---------- TEMOIGNAGES + FAQ ----------
function tmCards(l){
  var h = "";
  l.concat(l).forEach(function(x){
    h += '<div class="tc">' + (x.photoURL ? '<img src="' + E(x.photoURL) + '" onerror="this.style.opacity=0">' : '<i></i>') + '<div><b>' + E(x.clientName) + '</b><span>' + E(x.text) + '</span></div></div>';
  });
  return h;
}
function loadTm(id){
  api("getTestimonials", {productId:id}, function(r){
    var l = (r && r.ok) ? r.testimonials : [];
    $("tm-sec").style.display = l.length ? "block" : "none";
    $("tm-track").innerHTML = tmCards(l);
  });
}
function loadTmHome(){
  api("getTestimonials", {productId:""}, function(r){
    var l = (r && r.ok) ? r.testimonials.slice(0, 12) : [];
    $("tmh-sec").style.display = l.length ? "block" : "none";
    $("tmh-track").innerHTML = tmCards(l);
  });
}
function stickyCheck(){
  var b = $("p-btn"); if (!CP || !b) return;
  $("sticky").style.display = b.getBoundingClientRect().bottom < 0 ? "flex" : "none";
}
function trustBar(){
  var one = '<span>' + t("free") + '</span><span>' + t("cod") + '</span><span>' + t("qual") + '</span>';
  return '<div class="trk">' + one + one + one + one + '</div>';
}
function renderBrands(){
  var sec = $("brands-sec"), b = X.brands || [];
  if (!X.brandsOn || !b.length) { sec.style.display = "none"; return; }
  sec.style.display = "block";
  $("brands-title").textContent = L === "fr" ? X.brandsTitleFR : X.brandsTitleEN;
  var items = [], k = Math.max(1, Math.ceil(10 / b.length));
  for (var i = 0; i < k; i++) items = items.concat(b);
  var h = "";
  items.concat(items).forEach(function(x){ h += '<img src="' + E(x.l) + '" alt="' + E(x.n || "") + '" onerror="this.style.display=\'none\'">'; });
  $("brands-track").innerHTML = h;
}
function renderFaq(){
  var o = L === "fr" ? 2 : 0;
  $("faq").innerHTML = FAQ.map(function(f,i){ return '<div class="fq' + (i===0?" on":"") + '"><button onclick="this.parentNode.classList.toggle(\'on\')">' + E(f[o]) + '</button><p>' + E(f[o+1]) + '</p></div>' }).join("");
}

// ---------- COMMANDE ----------
function openModal(){
  var v = CP ? getV() : null; if (!v || SET.suspended) return;
  MODE = "single"; $("f-qty-w").style.display = "";
  $("stt").className = ""; $("f-btn").disabled = false;
  $("ov").style.display = "flex"; updSum();
}
function checkout(){
  if (SET.suspended || !cartLines().length) return;
  MODE = "cart"; closeCart(); $("f-qty-w").style.display = "none";
  $("stt").className = ""; $("f-btn").disabled = false;
  $("ov").style.display = "flex"; updSum();
}
function closeModal(){ $("ov").style.display = "none"; }
function lines(){
  if (MODE === "cart") return cartLines();
  var v = CP ? getV() : null;
  return v ? [{p:CP, v:v, qty:parseInt($("f-qty").value) || 1}] : [];
}
function updSum(){
  var A2 = lines(); if (!A2.length) return;
  var tot = 0, txt = [];
  A2.forEach(function(l){ tot += pr(l.v) * l.qty; txt.push(E(nm(l.p) + (l.v.size ? " - " + l.v.size : "") + (l.v.color ? " - " + l.v.color : "") + " x" + l.qty)); });
  $("sum-n").innerHTML = txt.join("<br>"); $("sum-t").textContent = fmt(tot);
}
function status(type, msg){ var s = $("stt"); s.className = type; s.textContent = msg; }
function submitOrder(){
  var LN = lines(); if (!LN.length) return;
  var d = {
    currency: CUR, lang: L,
    name: $("f-name").value.trim(), city: $("f-city").value.trim(), address: $("f-addr").value.trim(),
    phone1: $("f-ph1").value.trim(), phone2: $("f-ph2").value.trim(), note: $("f-note").value.trim(),
    items: LN.map(function(l){ return {productId: l.p.id, size: l.v.size, color: l.v.color, qty: l.qty}; })
  };
  if (!d.name || !d.city || !d.address || !d.phone1) return status("e", t("fill"));
  $("f-btn").disabled = true; status("l", t("send"));
  api("submitOrder", {data: JSON.stringify(d)}, function(r){
    if (r && r.ok) {
      status("o", t("ok") + d.name.split(" ")[0] + " !");
      ["f-name","f-city","f-addr","f-ph1","f-ph2","f-note"].forEach(function(i){ $(i).value = "" });
      if (MODE === "cart") { CART = []; saveCart(); }
      setTimeout(closeModal, 3500);
    } else status("e", (r && r.message) || t("err"));
    $("f-btn").disabled = false;
  });
}

// ---------- PANIER, MENU, RECHERCHE ----------
var CART = [], SQ = "", MODE = "single";
try { CART = JSON.parse(ls("nu_cart") || "[]") || []; } catch (e) { CART = []; }
function saveCart(){
  ls("nu_cart", JSON.stringify(CART));
  var n = CART.reduce(function(a, c){ return a + c.qty }, 0);
  ["cart-n", "bn-cart-n"].forEach(function(x){ $(x).textContent = n; $(x).style.display = n ? "flex" : "none"; });
}
function toast(m){
  var d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.appendChild(d);
  setTimeout(function(){ d.classList.add("on") }, 10);
  setTimeout(function(){ d.classList.remove("on"); setTimeout(function(){ d.remove() }, 300) }, 1800);
}
function addCart(){
  var v = CP ? getV() : null; if (!v || SET.suspended) return;
  var f = CART.filter(function(c){ return c.pid === CP.id && c.size === v.size && c.color === v.color })[0];
  if (f) f.qty = Math.min(10, f.qty + 1); else CART.push({pid: CP.id, size: v.size, color: v.color, qty: 1});
  saveCart(); toast(t("added"));
}
function cartLines(){
  var out = [];
  CART.forEach(function(c){
    var p = P.filter(function(x){ return x.id === c.pid })[0]; if (!p) return;
    var v = vs(p).filter(function(x){ return x.size === c.size && x.color === c.color })[0]; if (!v) return;
    out.push({p: p, v: v, qty: c.qty, c: c});
  });
  return out;
}
function openCart(){ renderCart(); $("cart-ov").style.display = "flex"; }
function closeCart(){ $("cart-ov").style.display = "none"; }
function renderCart(){
  var CL2 = cartLines(), el = $("cart-c");
  if (!CL2.length) { el.innerHTML = '<div class="empty">' + t("cartEmpty") + '</div>'; return; }
  var total = 0, h = "";
  CL2.forEach(function(l, i){
    var sub = pr(l.v) * l.qty; total += sub;
    var img = (l.p.photos && l.p.photos[0]) || l.p.photo;
    h += '<div class="ci"><img src="' + E(img) + '" alt=""><div class="cin"><b>' + E(nm(l.p)) + '</b><small>' + E((l.v.size || "") + (l.v.size && l.v.color ? " / " : "") + (l.v.color || "")) + '</small><div class="cq"><button onclick="cartQty(' + i + ',-1)">−</button><span>' + l.qty + '</span><button onclick="cartQty(' + i + ',1)">+</button></div></div><div class="cr"><b>' + fmt(sub) + '</b><button onclick="cartDel(' + i + ')">✕</button></div></div>';
  });
  el.innerHTML = h + '<div class="ctot"><span>' + t("total") + '</span><b>' + fmt(total) + '</b></div><button class="btn" onclick="checkout()">' + t("checkout") + '</button>';
}
function cartQty(i, d){ var l = cartLines()[i]; if (!l) return; l.c.qty = Math.max(1, Math.min(10, l.c.qty + d)); saveCart(); renderCart(); }
function cartDel(i){ var l = cartLines()[i]; if (!l) return; CART.splice(CART.indexOf(l.c), 1); saveCart(); renderCart(); }
function openMenu(){ $("drw").className = "drw on"; $("dov").className = "dov on"; }
function closeMenu(){ $("drw").className = "drw"; $("dov").className = "dov"; }
function doSearch(v){ SQ = v.trim().toLowerCase(); if (CP) goHome(); showView("home"); render(); }

// ---------- COMPTE A REBOURS + VISITEURS EN LIGNE (reglages dans l'admin) ----------
var X = {cdOn:false, cdMin:150, cdLoop:true, cdTextEN:"Limited offer! Hurry up!", cdTextFR:"Offre limitée ! Dépêchez-vous !", viOn:false, viMin:2, viLabelEN:"Visitors online now", viLabelFR:"Visiteurs en ligne actuellement", brandsOn:false, brandsTitleEN:"Our brands", brandsTitleFR:"Nos marques", brands:[]};
var cdT = null, vN = 0, vStarted = false;
var SID = (function(){ var k = ls("nu_sid"); if (!k) { k = "s" + Date.now() + Math.random().toString(36).slice(2, 8); ls("nu_sid", k); } return k; })();
function pad(n){ return ("0" + n).slice(-2) }
function renderCd(){
  var b = $("cd-box"); clearInterval(cdT);
  if (!X.cdOn || !CP) { b.innerHTML = ""; return; }
  var fr = L === "fr";
  b.innerHTML = '<div class="cd"><div class="cd-t">' + E(fr ? X.cdTextFR : X.cdTextEN) + '</div><div class="cd-n"><span><b id="cd-h">00</b><i>' + (fr ? "Heures" : "Hours") + '</i></span><span><b id="cd-m">00</b><i>Min</i></span><span><b id="cd-s">00</b><i>Sec</i></span></div></div>';
  var dur = (parseInt(X.cdMin) || 150) * 60000, end = parseInt(ls("nu_cd_end")) || 0;
  if (!end || ls("nu_cd_dur") !== String(dur) || (end < Date.now() && X.cdLoop)) { end = Date.now() + dur; ls("nu_cd_end", end); ls("nu_cd_dur", dur); }
  function tick(){
    var r = end - Date.now();
    if (r <= 0) {
      if (X.cdLoop) { end = Date.now() + dur; ls("nu_cd_end", end); r = dur; }
      else { b.innerHTML = ""; clearInterval(cdT); return; }
    }
    var t = Math.floor(r / 1000);
    $("cd-h").textContent = pad(Math.floor(t / 3600)); $("cd-m").textContent = pad(Math.floor(t % 3600 / 60)); $("cd-s").textContent = pad(t % 60);
  }
  tick(); cdT = setInterval(tick, 1000);
}
function renderVi(){
  var b = $("vi-box");
  if (!X.viOn || !CP || vN < (parseInt(X.viMin) || 1)) { b.innerHTML = ""; return; }
  b.innerHTML = '<div class="vi"><i></i><b>' + vN + '</b> ' + E(L === "fr" ? X.viLabelFR : X.viLabelEN) + '</div>';
}
function pingVisit(){
  if (document.hidden) return;
  api("adm", {adm:"pub", sub:"visit", sid:SID}, function(r){ if (r && r.ok) { vN = r.n; renderVi(); } });
}
function startVisits(){
  if (vStarted || !X.viOn) return;
  vStarted = true; pingVisit(); setInterval(pingVisit, 30000);
}

function hideSplash(){
  var sp = $("splash"); if (!sp || sp.className === "off") return;
  sp.className = "off"; setTimeout(function(){ sp.remove() }, 500);
}
setTimeout(hideSplash, 20000);

// ---------- DEMARRAGE ----------
function route(){
  var m = location.pathname.match(/^\/produit\/([^\/]+)/);
  var id = m ? decodeURIComponent(m[1]) : new URLSearchParams(location.search).get("id");
  if (id && P.length) openProd(id, false); else goHome(false);
}
window.onpopstate = route;
L = ls("nu_lang") || ((navigator.language || "en").toLowerCase().indexOf("fr") === 0 ? "fr" : "en");
CUR = ls("nu_cur") || (L === "fr" ? "XOF" : "NGN");
$("yr").textContent = new Date().getFullYear();
saveCart(); updWish(); showView("home");
initSlider("hero", ["/hero.png"]); initSlider("promo", ["/collection.png"]);
update();
api("adm", {adm:"pub"}, function(r){ if (r && r.ok && r.x) { X = r.x; update(); startVisits(); } });
loadTmHome();
api("getSettings", {}, function(r){ if (r && r.ok) { SET = r.settings; update(); } });
api("getProducts", {}, function(r){
  LOADED = true;
  if (!r || !r.ok) { FAIL = true; render(); hideSplash(); return; }
  P = r.products || []; render(); route(); hideSplash();
});
</script>
